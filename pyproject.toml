[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elder-monitor"
version = "0.1.0"
description = "Agentic vision prototype for bed-exit and activity monitoring"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python>=4.9",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "ultralytics>=8.3",
    "lap>=0.5",
]

[project.optional-dependencies]
vlm = ["torch>=2.2", "transformers>=4.56", "accelerate>=0.30", "pillow>=10"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
elder-monitor = "elder_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elder_monitor = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
